services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scopra
      POSTGRES_PASSWORD: scopra
      POSTGRES_DB: scopra
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["scopra-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  scopra-postgres:
